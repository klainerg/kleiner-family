<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>שורשי משפחת קליינר</title><meta name="theme-color" content="#243e38"><link rel="stylesheet" href="styles.css?v=3"><script defer src="script.js?v=3"></script><style>
/* התאמות הקריאה נשמרות כאן כדי לעדכן רק את index.html. */
.chapter p{font-size:1.375rem;line-height:1.95}
.hero{display:block;min-height:0;padding:40px 0 45px}
.hero h1{font-size:clamp(42px,5vw,64px);margin:16px 0 0}
.hero .read-link{display:none}
.menu-toggle{display:none!important}
header #navigation{display:flex;width:auto;padding:0}
[hidden]{display:none!important}
@media(max-width:700px){
 .chapter p{font-size:1.3125rem;line-height:1.9}
 .chapter h3{font-size:2rem}
 .hero{padding:25px 0 30px}
 .story-section{padding-top:35px}
}

.language-switch{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.language-switch button{border:1px solid var(--line);padding:8px 18px;background:transparent;color:var(--ink);font-size:1rem;min-height:44px}
.language-switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
html[dir="ltr"] #chapter-nav{border-right:0;border-left:1px solid var(--line);padding-right:0;padding-left:16px}
html[lang="ru"] .chapter p{unicode-bidi:normal;text-align:left}
</style></head>
<body>
<a class="skip" href="#story">מעבר לסיפור</a>
<header><a class="brand" href="#home">קליינר <span>הארכיון המשפחתי</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="navigation">תפריט</button><nav id="navigation" aria-label="ניווט ראשי"><a href="#story">הסיפור המשפחתי</a></nav></header>
<main>
<section class="hero" id="home"><div class="hero-copy"><span class="eyebrow">הארכיון המשפחתי</span><h1>שורשי משפחת<br>קליינר</h1><div class="language-switch" role="group" aria-label="שפת הסיפור"><button type="button" data-language="he" lang="he" aria-pressed="true">עברית</button><button type="button" data-language="ru" lang="ru" aria-pressed="false">Русский</button></div><a class="read-link" href="#story">לקריאת הסיפור</a></div></section>
<section id="story" class="story-section"><div class="section-heading"><span class="eyebrow">01 / הסיפור</span><h2>הסיפור המשפחתי</h2></div><div class="story-layout"><aside><span>פרקי הסיפור</span><nav id="chapter-nav" aria-label="פרקי הסיפור"></nav></aside><div id="chapters" aria-busy="true"><p class="status" role="status">טוען את הסיפור…</p></div></div><noscript>יש להפעיל JavaScript כדי לקרוא את הפרקים.</noscript></section>






<!-- נקודות החיבור נשמרות מוסתרות לתאימות ל-script.js הקיים. -->
<div hidden aria-hidden="true"><div id="hero-image"></div><div id="family-items"></div><ol id="timeline-items"></ol><div id="photo-items"></div><div id="document-items"></div><div id="source-items"></div><div id="research-text"></div></div>
</main><footer>שורשי משפחת קליינר <a href="#home">חזרה למעלה</a></footer>
<dialog id="lightbox" aria-label="תצוגת תמונה מוגדלת"><button class="close-lightbox" aria-label="סגירת התמונה">סגירה ×</button><figure><img alt=""><figcaption></figcaption></figure></dialog>
</body></html>
